name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Set package version from tag
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          npm version "$release_version" --no-git-tag-version --allow-same-version --ignore-scripts
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!==process.argv[1]||l.version!==process.argv[1]||l.packages[''].version!==process.argv[1]) process.exit(1)" "$release_version"
      - run: npm ci
      - run: npm run check
      - run: npm run check:distribution
      - name: Verify checks did not change other tracked files
        shell: bash
        run: test -z "$(git diff --name-only -- . ':(exclude)package.json' ':(exclude)package-lock.json')"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Set package version from tag
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          npm version "$release_version" --no-git-tag-version --allow-same-version --ignore-scripts
      - run: npm ci
      - name: Build stable market package
        run: |
          mkdir release
          archive="$(npm pack --pack-destination release | tail -n 1)"
          mv "release/$archive" release/ming-life.tgz
      - name: Verify release package through the Desktop market install boundary
        run: |
          install_dir="$(mktemp -d)"
          printf '{"name":"market-release-smoke","private":true,"version":"0.0.0"}\n' > "$install_dir/package.json"
          node node_modules/pnpm/bin/pnpm.cjs add "file:$GITHUB_WORKSPACE/release/ming-life.tgz" \
            --dir "$install_dir" \
            --config.auto-install-peers=false \
            --config.node-linker=hoisted
          node -e "const p=require(process.argv[1]); if(p.name!=='ming-life'||p.version!==require('./package.json').version) process.exit(1)" \
            "$install_dir/node_modules/ming-life/package.json"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
